<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Student Management System</h1>
            <p>CRUD Application using Express and SQLite</p>
        </div>
    </header>

    <main class="container">

        <section class="card">

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input
                    type="hidden"
                    id="studentId"
                >

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <div class="buttons">

                    <button type="submit" id="submitButton">
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary"
                        onclick="cancelEdit()"
                        style="display: none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>

        <section class="card">

            <div class="table-header">

                <h2>Students</h2>

                <button onclick="loadStudents()">
                    Refresh
                </button>

            </div>

            <div id="message"></div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Task 9 • Student Management CRUD Application</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
